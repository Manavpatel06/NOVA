[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA — voice-first, always-on personal assistant"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "sounddevice",
    "soundfile",
    "pyyaml",
    "psutil",
    "faster-whisper",
    "onnxruntime",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["nova*"]
