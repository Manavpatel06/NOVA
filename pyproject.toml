[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA — voice-first, always-on personal assistant"
requires-python = ">=3.13"
dependencies = [
    # Pinned to what is actually installed and verified on this machine.
    # requirements.txt is the annotated source of truth; keep them in step.
    "numpy==2.5.2",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "tokenizers==0.23.1",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.24.0.43",
    "onnxruntime==1.29.0",
    "kokoro-onnx==0.5.0",
    "keyboard==0.13.5",
    "pywin32==312",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["nova*"]
