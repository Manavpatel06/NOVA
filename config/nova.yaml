# NOVA — the one config file (docs/CONTRACTS.md).
#
# Every key here has a real consumer in an M0 module (see nova/config.py for
# the mapping). Unknown keys anywhere in this file are a hard error at load
# time — that's deliberate: a config file full of options nothing reads is
# how the retired build lost track of what was true.

audio:
  samplerate: 16000   # Hz — required by the STT/VAD models; nova.audio.Capture
  channels: 1          # mono
  frame_ms: 30         # capture frame size (ms) handed to Capture.read()

stt:
  model: large-v3-turbo   # faster-whisper model name, resolved from cache/hf/hub
  language: en

tts:
  # false = NOVA prints its replies instead of speaking them.
  # Deliberate muting, not a fault: nothing warns, and the SAPI
  # fallback is never reached. Flip this when you're working at the
  # same desk NOVA is talking at.
  speak: true
  voice: af_heart      # Kokoro voice id
  speed: 1.0

security:
  egress_allowlist: []   # domains nova.security.Egress may reach; empty until a skill needs one

  # Closed allowlist for nova.skills.open_app (docs/THREAT_MODEL.md #1.1).
  # Symbolic name -> absolute executable path. open_app never accepts a raw
  # path from the router; it only ever looks a name up here.
  allowed_apps:
    notepad: 'C:\Windows\System32\notepad.exe'
    calculator: 'C:\Windows\System32\calc.exe'
    explorer: 'C:\Windows\explorer.exe'
    file explorer: 'C:\Windows\explorer.exe'
    task manager: 'C:\Windows\System32\Taskmgr.exe'
    control panel: 'C:\Windows\System32\control.exe'

  # Trusted directories an allowed_apps entry must realpath-land inside at
  # call time, junctions included. open_app refuses to launch anything that
  # resolves outside this set.
  allowed_app_dirs:
    - 'C:\Windows\System32'
    - 'C:\Windows\SysWOW64'
    - 'C:\Windows'
    - 'C:\Program Files'
    - 'C:\Program Files (x86)'
    # NOT here, deliberately: any per-user-writable directory
    # (%LOCALAPPDATA%, %APPDATA%). Containment only works because an
    # attacker who can plant a Start Menu shortcut cannot also write
    # into these dirs -- they are admin-writable. Add a user-writable
    # one and those two collapse into the same trust level: whoever
    # plants the shortcut plants its target too. That is why Discord,
    # VS Code and Steam are refused, and the refusal is correct.
    # C:\Program Files\WindowsApps was here and was trimmed 2026-08-20:
    # no allowed_apps entry ever resolved inside it, so it was pure
    # trust surface with no benefit (nova-security flagged it dormant).

  # Manav's own private terms (name, employer, ...) redacted case-
  # insensitively by nova.security.redact. Empty by default -- opt-in,
  # never inferred.
  redact_terms: []

hotkey:
  combo: ctrl+alt+space      # `keyboard` package hotkey string
  tap_threshold_ms: 300      # <= this held duration = tap (latch toggle); > this = hold (classic PTT)
  latch_timeout_ms: 30000    # LATCHED auto-expires after this long with no closing tap

wake:
  model_path: hey_jarvis_v0.1.onnx   # resolved against models/wake/; swap for hey_nova.onnx later, zero code changes
  # The one knob Manav will actually tune -- this is the access-control gate
  # for hands-free arming, not a comfort setting.
  #
  # 0.75 is DEFENCE IN DEPTH, NOT A SOLUTION. It halves the observed false-accept
  # rate and closes nothing. "hey jazz" -- two ordinary English words -- has been
  # measured at 0.5125, then 0.6449, then 0.9321 across three sessions, and a
  # dedicated 6-trial run gave 0.466-0.924 with two of six above 0.75. The
  # observed maximum has risen EVERY time anyone sampled more, which is a right
  # tail nobody has bounded. Do not read this number as "false accepts are
  # handled": raising it further is not known to help, and every true-positive
  # figure we have (0.996-0.999) is Kokoro-synthetic -- no human has spoken to
  # this detector, so a higher floor could reject "hey jazz" and also fail to
  # hear Manav (F41). The real control is F28's tier cap, not this number.
  threshold: 0.75
  preroll_ms: 1000             # audio kept before detection so the first syllables aren't lost
  arm_timeout_ms: 15000        # hard ceiling if VAD never detects end-of-speech
  vad_silence_ms: 800          # trailing silence that ends an armed turn once speech has started

duplex:
  # T1.7 (F26): half-duplex mute-while-NOVA-is-speaking gate for the wake
  # word, plus a hangover after speech ends. Inherited from the retired
  # build's 180ms (speaker decay + WASAPI output buffering), rounded up --
  # NOT measured on this machine's speakers/room. See nova/audio/duplex.py.
  hangover_ms: 200

brain:
  # Calibrated against a labelled phrase set, not chosen decoratively --
  # see nova/brain/router.py's module docstring for the method and the
  # measured score gap these two numbers sit inside.
  confidence_floor: 0.42
  ambiguity_margin: 0.08

governor:
  # Measured, not modelled -- see docs/GOVERNOR_MEASUREMENTS.md for the
  # real numbers and the command that produced each one. 900 MB sits just
  # above Transcriber's measured post-use host-RSS floor (~740-780 MB) and
  # below "both resident" (~1150-1350 MB) -- the realistic job this does
  # is shedding Kokoro when both are loaded and idle.
  poll_interval_s: 5.0
  rss_ceiling_mb: 2048.0   # raised from 900 on 2026-10-13 (Manav): keep models resident -- no unload/reload churn, no F21 VRAM creep; see docs/decisions/0012
