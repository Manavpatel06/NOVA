# NOVA — the one config file (docs/CONTRACTS.md).
#
# Every key here has a real consumer in an M0 module (see nova/config.py for
# the mapping). Unknown keys anywhere in this file are a hard error at load
# time — that's deliberate: a config file full of options nothing reads is
# how the retired build lost track of what was true.

audio:
  samplerate: 16000   # Hz — required by the STT/VAD models; nova.audio.Capture
  channels: 1          # mono
  frame_ms: 30         # capture frame size (ms) handed to Capture.read()

stt:
  model: large-v3-turbo   # faster-whisper model name, resolved from cache/hf/hub
  language: en

tts:
  voice: af_heart      # Kokoro voice id
  speed: 1.0

security:
  egress_allowlist: []   # domains nova.security.Egress may reach; empty until a skill needs one

  # Closed allowlist for nova.skills.open_app (docs/THREAT_MODEL.md #1.1).
  # Symbolic name -> absolute executable path. open_app never accepts a raw
  # path from the router; it only ever looks a name up here.
  allowed_apps:
    notepad: 'C:\Windows\System32\notepad.exe'
    calculator: 'C:\Windows\System32\calc.exe'
    explorer: 'C:\Windows\explorer.exe'
    file explorer: 'C:\Windows\explorer.exe'
    task manager: 'C:\Windows\System32\Taskmgr.exe'
    control panel: 'C:\Windows\System32\control.exe'

  # Trusted directories an allowed_apps entry must realpath-land inside at
  # call time, junctions included. open_app refuses to launch anything that
  # resolves outside this set.
  allowed_app_dirs:
    - 'C:\Windows\System32'
    - 'C:\Windows\SysWOW64'
    - 'C:\Windows'
    - 'C:\Program Files'
    - 'C:\Program Files (x86)'
    - 'C:\Program Files\WindowsApps'
